# Case Study Creator Workflow Configuration
name: "case-study-creator"
description: "Create compelling case studies through guided interview process. Uses investigative questioning, empathy techniques, and storytelling frameworks to extract authentic stories and craft blog-ready narratives that capture the subject's voice and showcase transformation."
author: "BMad"

# Critical variables load from config_source
config_source: "{project-root}/{bmad_folder}/cis/config.yaml"
output_folder: "{config_source}:output_folder"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
date: system-generated

# Context can be provided via data attribute when invoking
# Example: data="{path}/company-context.md" provides background context

# Module path and component files
installed_path: "{project-root}/{bmad_folder}/cis/workflows/case-study-creator"
template: "{installed_path}/template.mdx"
instructions: "{installed_path}/instructions.md"

# Required Data Files
case_study_techniques: "{installed_path}/case-study-techniques.csv"

# Output configuration
default_output_file: "{output_folder}/case-study-{{date}}.mdx"

standalone: true

web_bundle:
  name: "case-study-creator"
  description: "Create compelling case studies through guided interview process. Uses investigative questioning, empathy techniques, and storytelling frameworks to extract authentic stories and craft blog-ready narratives."
  author: "BMad"
  instructions: "{bmad_folder}/cis/workflows/case-study-creator/instructions.md"
  template: "{bmad_folder}/cis/workflows/case-study-creator/template.mdx"
  web_bundle_files:
    - "{bmad_folder}/cis/workflows/case-study-creator/instructions.md"
    - "{bmad_folder}/cis/workflows/case-study-creator/template.mdx"
    - "{bmad_folder}/cis/workflows/case-study-creator/case-study-techniques.csv"
