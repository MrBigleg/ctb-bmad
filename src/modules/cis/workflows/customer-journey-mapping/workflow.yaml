# Customer Journey Mapping Workflow Configuration
name: "customer-journey-mapping"
description: "Map complete customer experience from discovery to loyalty. Identify friction points, design wow moments, and create actionable improvement plan. Visual journey map output with Mermaid diagrams showing touchpoints, emotions, and opportunities across the customer lifecycle."
author: "BMad"

# Critical variables load from config_source
config_source: "{project-root}/{bmad_folder}/cis/config.yaml"
output_folder: "{config_source}:output_folder"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
date: system-generated

# Context can be provided via data attribute when invoking
# Example: data="{path}/business-context.md" provides background information

# Module path and component files
installed_path: "{project-root}/{bmad_folder}/cis/workflows/customer-journey-mapping"
template: "{installed_path}/template.md"
instructions: "{installed_path}/instructions.md"

# Required Data Files
journey_techniques: "{installed_path}/journey-mapping-techniques.csv"

# Output configuration
default_output_file: "{output_folder}/customer-journey-map-{{date}}.md"

standalone: true

web_bundle:
  name: "customer-journey-mapping"
  description: "Map complete customer experience from discovery to loyalty. Visual journey maps with friction analysis and actionable improvement plans for local businesses."
  author: "BMad"
  instructions: "{bmad_folder}/cis/workflows/customer-journey-mapping/instructions.md"
  template: "{bmad_folder}/cis/workflows/customer-journey-mapping/template.md"
  web_bundle_files:
    - "{bmad_folder}/cis/workflows/customer-journey-mapping/instructions.md"
    - "{bmad_folder}/cis/workflows/customer-journey-mapping/template.md"
    - "{bmad_folder}/cis/workflows/customer-journey-mapping/journey-mapping-techniques.csv"
